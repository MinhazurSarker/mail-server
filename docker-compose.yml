services:
  # ====================================================================
  # Database Service (MongoDB 7.0 Enterprise Engine)
  # ====================================================================
  mongodb:
    image: mongo:7.0
    container_name: cellsinbox_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: cellsinbox
    volumes:
      - mongo_data:/data/db
    networks:
      - cellsinbox_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ====================================================================
  # Inbound SMTP Receiver Daemon (Port 25 Direct-to-Host)
  # ====================================================================
  smtp_server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    container_name: cellsinbox_server
    restart: unless-stopped
    ports:
      - "25:25"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/cellsinbox
      - SMTP_HOST=0.0.0.0
      - SMTP_PORT=25
      - MAIL_HELO_HOST=${MAIL_HELO_HOST:-mail.cellsweb.com}
      - SMTP_TLS_KEY_PATH=${SMTP_TLS_KEY_PATH:-/etc/dokploy/shared-certs/private/mail.cellsweb.com.key}
      - SMTP_TLS_CERT_PATH=${SMTP_TLS_CERT_PATH:-/etc/dokploy/shared-certs/certs/mail.cellsweb.com.crt}
    volumes:
      - /etc/dokploy/shared-certs:/etc/dokploy/shared-certs:ro
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - cellsinbox_net

  # ====================================================================
  # CellsWeb RPC API & Real-Time WebSockets Engine
  # ====================================================================
  api_server:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-server
    container_name: cellsinbox_api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/cellsinbox
      - API_HOST=0.0.0.0
      - API_PORT=4000
      - JWT_SECRET=${JWT_SECRET:-sovereign_secret_key_cellsweb_2026_super_secure}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-sovereign_refresh_secret_cellsweb_2026_super_secure}
      - FRONTEND_URL=${FRONTEND_URL:-https://webmail.cellsweb.com}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - cellsinbox_net
      - dokploy-network

  # ====================================================================
  # Outbound Delivery MTA & Background Queue Worker
  # ====================================================================
  queue_worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: queue
    container_name: cellsinbox_queue
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/cellsinbox
      - MAIL_HELO_HOST=${MAIL_HELO_HOST:-mail.cellsweb.com}
      - QUEUE_POLL_INTERVAL_MS=3000
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - cellsinbox_net

  # ====================================================================
  # Unified Web Client (Webmail, Org Admin & Platform Governance)
  # ====================================================================
  web_client:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    container_name: cellsinbox_web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - INTERNAL_API_URL=http://api_server:4000
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://webmail.cellsweb.com}
    depends_on:
      - api_server
    networks:
      - cellsinbox_net
      - dokploy-network

networks:
  cellsinbox_net:
    driver: bridge
  dokploy-network:
    external: true

volumes:
  mongo_data:
    driver: local
