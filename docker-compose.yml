services:
  # ====================================================================
  # Database Service (MongoDB 7.0 Enterprise Engine)
  # ====================================================================
  mongodb:
    image: mongo:7.0
    container_name: cellsinbox_mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_DATABASE: cellsinbox
    volumes:
      - mongo_data:/data/db
    networks:
      - cellsinbox_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ====================================================================
  # Inbound SMTP Receiver Daemon (Port 25 Direct-to-Host)
  # ====================================================================
  smtp_server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    container_name: cellsinbox_server
    restart: unless-stopped
    ports:
      - "25:25"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/cellsinbox
      - SMTP_HOST=0.0.0.0
      - SMTP_PORT=25
      - MAIL_HELO_HOST=${MAIL_HELO_HOST:-mail.yourdomain.com}
      - SMTP_TLS_KEY_PATH=/etc/letsencrypt/live/${MAIL_HELO_HOST:-mail.yourdomain.com}/privkey.pem
      - SMTP_TLS_CERT_PATH=/etc/letsencrypt/live/${MAIL_HELO_HOST:-mail.yourdomain.com}/fullchain.pem
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - cellsinbox_net

  # ====================================================================
  # CellsWeb RPC API & Real-Time WebSockets Engine
  # ====================================================================
  api_server:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-server
    container_name: cellsinbox_api
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/cellsinbox
      - API_HOST=0.0.0.0
      - API_PORT=4000
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - cellsinbox_net

  # ====================================================================
  # Outbound Delivery MTA & Background Queue Worker
  # ====================================================================
  queue_worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: queue
    container_name: cellsinbox_queue
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/cellsinbox
      - MAIL_HELO_HOST=${MAIL_HELO_HOST:-mail.yourdomain.com}
      - QUEUE_POLL_INTERVAL_MS=3000
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - cellsinbox_net

  # ====================================================================
  # Unified Web Client (Webmail, Org Admin & Platform Governance)
  # ====================================================================
  web_client:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    container_name: cellsinbox_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:4000/ws}
    depends_on:
      - api_server
    networks:
      - cellsinbox_net

networks:
  cellsinbox_net:
    driver: bridge

volumes:
  mongo_data:
    driver: local
